name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apiforge_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d apiforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit, safety, and H2 integration tests; package
        run: ./mvnw -B -ntp verify
      - name: PostgreSQL integration tests
        run: >-
          ./mvnw -B -ntp -Dtest=ApiIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/apiforge_test
          -Dspring.datasource.username=test_user
          -Dspring.datasource.password=test-only-not-a-secret test
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Production build with a non-secret example HTTPS origin
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example-api.onrender.com
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Start isolated H2-backed demo
        run: java -jar backend/target/apiforge-ai-0.1.0.jar --spring.profiles.active=demo > /tmp/apiforge-browser.log 2>&1 &
      - name: Install frontend and browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Privacy and analysis browser workflow
        working-directory: frontend
        run: npm run test:e2e
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build complete production Docker image (including backend tests)
        run: docker build -t apiforge-ai:portfolio backend
      - name: Production runtime with local verified-TLS PostgreSQL
        run: ./scripts/smoke-docker.sh apiforge-ai:portfolio
