server:
  address: 0.0.0.0
  port: ${PORT:10000}
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
# Gemini is additionally rejected by AnalysisService regardless of environment flags.
gemini:
  enabled: false
