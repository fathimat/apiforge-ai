server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    threads:
      max: 16
      min-spare: 2
    max-connections: 64
    accept-count: 16
    connection-timeout: 10s
    max-swallow-size: 128KB
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/apiforge}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 15000
      idle-timeout: 60000
      max-lifetime: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      enabled: false
  mvc:
    log-request-details: false
logging:
  level:
    org.springframework.web: ERROR
    org.hibernate.SQL: OFF
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  limits:
    max-body-bytes: 131072
    global-per-minute: 120
    peer-per-minute: 30
    max-concurrent: 4
gemini:
  enabled: false
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
