name: apiforge-ai
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apiforge
      POSTGRES_USER: apiforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - apiforge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiforge -d apiforge"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  apiforge-data:
