name: apiforge-ai
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apiforge
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - apiforge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d apiforge"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  apiforge-data:
